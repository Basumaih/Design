<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>مسار — النموذج المترابط</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="masar.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; background: #0A1620; color: #EEF4F1; font-family: 'IBM Plex Sans Arabic', sans-serif; position: relative; overflow: hidden">
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<dc-import name="Home" accent="{{accent}}" shared="{{shared}}" on-share="{{share}}" on-nav="{{nav}}" hint-size="390px,844px"></dc-import>
</sc-if>
<sc-if value="{{isOrder}}" hint-placeholder-val="{{ false }}">
<dc-import name="Order" accent="{{accent}}" shared="{{shared}}" on-share="{{share}}" on-nav="{{nav}}" hint-size="390px,844px"></dc-import>
</sc-if>
<sc-if value="{{isArrival}}" hint-placeholder-val="{{ false }}">
<dc-import name="Arrival" accent="{{accent}}" shared="{{shared}}" on-share="{{share}}" on-nav="{{nav}}" hint-size="390px,844px"></dc-import>
</sc-if>
<sc-if value="{{isFueling}}" hint-placeholder-val="{{ false }}">
<dc-import name="Fueling" accent="{{accent}}" shared="{{shared}}" on-share="{{share}}" on-nav="{{nav}}" hint-size="390px,844px"></dc-import>
</sc-if>
<sc-if value="{{isExit}}" hint-placeholder-val="{{ false }}">
<dc-import name="Exit" accent="{{accent}}" shared="{{shared}}" on-share="{{share}}" on-nav="{{nav}}" hint-size="390px,844px"></dc-import>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F03C","options":["#C8F03C","#56CFE1","#FFB547"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { screen: 'home', shared: { car: 0, station: 'a', mode: 'amount', amount: 100, pay: 'apple', pre: true, lane: 3, fueled: null, cart: [] } };
  }
  renderVals() {
    const sc = this.state.screen;
    return {
      accent: this.props.accent ?? '#C8F03C',
      shared: this.state.shared,
      share: (o) => this.setState((st) => ({ shared: { ...st.shared, ...o } })),
      nav: (to) => {
        if (to === 'home') this.setState((st) => ({ screen: 'home', shared: { ...st.shared, fueled: null, cart: [], lane: 3 } }));
        else this.setState({ screen: to });
      },
      isHome: sc === 'home', isOrder: sc === 'order', isArrival: sc === 'arrival', isFueling: sc === 'fueling', isExit: sc === 'exit'
    };
  }
}
</script>
</body>
</html>
