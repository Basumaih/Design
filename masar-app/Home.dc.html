<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>مسار — قبل الوصول</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1620;font-family:'IBM Plex Sans Arabic',sans-serif;color:#EEF4F1}
a{color:#C8F03C}a:hover{color:#E2FF7A}
button{font-family:inherit}
.scroll::-webkit-scrollbar{display:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,181,71,.55)}70%{box-shadow:0 0 0 12px rgba(255,181,71,0)}100%{box-shadow:0 0 0 0 rgba(255,181,71,0)}}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.pulse{animation:pulse 2s infinite}
.rise{animation:rise .45s ease-out both}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; background: #0A1620; position: relative; overflow: hidden; display: flex; flex-direction: column">

<div class="scroll" style="flex-grow: 1; overflow-y: auto; scrollbar-width: none; padding: 26px 20px 176px; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 14px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
<svg width="26" height="26" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M10 40V14M38 40V14M24 40V10" stroke="#0A1620" stroke-width="5" stroke-linecap="round"></path><path d="M16 17l8-9 8 9" stroke="#0A1620" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 13px; color: #93A9B3">مساء الخير</span>
<span style="font-family: Alexandria, sans-serif; font-weight: 700; font-size: 19px">عبدالرحمن</span>
</div>
</div>
<button aria-label="التنبيهات" style="width: 44px; height: 44px; border-radius: 14px; background: #102230; border: 1px solid #1E3B4B; color: #EEF4F1; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
<span style="position: absolute; top: 10px; left: 11px; width: 8px; height: 8px; border-radius: 4px; background: #FFB547"></span>
</button>
</div>

<div class="rise" style="border-radius: 28px; background: #102230; border: 1px solid #1E3B4B; padding: 18px; display: flex; gap: 16px; align-items: center">
<div style="position: relative; width: 112px; height: 112px; flex-shrink: 0">
<svg width="112" height="112" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="#1E3B4B" stroke-width="12"></circle><circle cx="60" cy="60" r="50" fill="none" stroke="#FFB547" stroke-width="12" stroke-linecap="round" stroke-dasharray="44 314" transform="rotate(-90 60 60)"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span style="font-family: Alexandria, sans-serif; font-weight: 800; font-size: 30px; line-height: 1">14%</span>
<span style="font-size: 12px; color: #93A9B3; margin-top: 4px">الخزان</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
<div class="pulse" style="align-self: flex-start; font-size: 12px; font-weight: 600; color: #0A1620; background: #FFB547; border-radius: 999px; padding: 3px 10px">وقود منخفض</div>
<div style="font-family: Alexandria, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.4">يكفي لقرابة 52 كم</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #93A9B3">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#56CFE1" stroke-width="2" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><circle cx="12" cy="20" r="1"></circle></svg>
متصل بحاسوب السيارة · كامري 2024
</div>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<h2 style="margin: 0; font-family: Alexandria, sans-serif; font-weight: 700; font-size: 18px">أقرب المحطات لك</h2>
<span style="font-size: 13px; color: #93A9B3">مرتبة حسب وقت الانتظار</span>
</div>

<div class="scroll" style="display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{stations}}" as="st" hint-placeholder-count="3">
<button onClick="{{st.pick}}" aria-pressed="{{st.on}}" style="flex-shrink: 0; width: 210px; min-height: 132px; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; cursor: pointer; color: #EEF4F1; font-family: inherit; transition: all .25s; background: {{st.bg}}; border: 1.5px solid {{st.border}}">
<div style="display: flex; align-items: center; justify-content: space-between; width: 100%">
<span style="font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 10px; color: #0A1620; background: {{st.crowdColor}}">ازدحام {{st.crowd}}</span>
<span style="font-size: 12px; color: #93A9B3">{{st.dist}}</span>
</div>
<div style="font-family: Alexandria, sans-serif; font-weight: 600; font-size: 15px; text-align: right; line-height: 1.4">{{st.name}}</div>
<div style="display: flex; gap: 14px; font-size: 12px; color: #A9BCC4">
<span>كبائن شاغرة <b style="color: #EEF4F1">{{st.free}}</b></span>
<span>انتظار <b style="color: #EEF4F1">{{st.wait}}</b></span>
</div>
</button>
</sc-for>
</div>

<div class="rise" style="border-radius: 28px; background: #102230; border: 1px solid #1E3B4B; padding: 18px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-family: Alexandria, sans-serif; font-weight: 700; font-size: 16px">الوقود المتوفر الآن</div>
<span style="font-size: 12px; color: #93A9B3">{{sel.name}}</span>
</div>
<sc-for list="{{sel.fuel}}" as="f" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 44px; font-family: Alexandria, sans-serif; font-weight: 700; font-size: 15px">{{f.t}}</span>
<div style="flex-grow: 1; height: 10px; border-radius: 5px; background: #1E3B4B; overflow: hidden"><div style="height: 100%; border-radius: 5px; transition: width .5s; width: {{f.w}}; background: {{f.c}}"></div></div>
<span style="width: 38px; font-size: 13px; color: #A9BCC4; text-align: left">{{f.p}}%</span>
</div>
</sc-for>
</div>

<div style="border-radius: 28px; background: #102230; border: 1px solid #1E3B4B; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="font-family: Alexandria, sans-serif; font-weight: 700; font-size: 16px">الازدحام في المرافق</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{sel.fac}}" as="fc" hint-placeholder-count="4">
<div style="border-radius: 18px; background: #16303F; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; font-weight: 600">{{fc.n}}</span><span style="font-size: 12px; color: {{fc.c}}">{{fc.lvl}}</span></div>
<div style="height: 6px; border-radius: 3px; background: #0A1620; overflow: hidden"><div style="height: 100%; border-radius: 3px; transition: width .5s; width: {{fc.w}}; background: {{fc.c}}"></div></div>
</div>
</sc-for>
</div>
</div>

</div>

<div style="position: absolute; right: 0; left: 0; bottom: 0; padding: 14px 20px 22px; background: #0A1620; border-top: 1px solid #16303F; display: flex; flex-direction: column; gap: 14px">
<a href="Order.dc.html" style="height: 56px; border-radius: 18px; background: {{accent}}; color: #0A1620; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: Alexandria, sans-serif; font-weight: 700; font-size: 16px">
جهّز تعبئتك في {{sel.short}}
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
</a>
<nav aria-label="التنقل الرئيسي" style="display: flex; justify-content: space-between; padding: 0 6px">
<button style="background: none; border: 0; color: {{accent}}; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; min-width: 52px; min-height: 44px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>الرئيسية</button>
<button style="background: none; border: 0; color: #93A9B3; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; min-width: 52px; min-height: 44px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>المحطات</button>
<button style="background: none; border: 0; color: #93A9B3; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; min-width: 52px; min-height: 44px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"></rect><path d="M3 10h18M16 15h2"></path></svg>المحفظة</button>
<button style="background: none; border: 0; color: #93A9B3; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; min-width: 52px; min-height: 44px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="2"></rect><path d="M12 8v13M3 12h18M12 8S10 3 7.5 3a2.5 2.5 0 0 0 0 5M12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"></path></svg>المكافآت</button>
<button style="background: none; border: 0; color: #93A9B3; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; min-width: 52px; min-height: 44px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>حسابي</button>
</nav>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8F03C","options":["#C8F03C","#56CFE1","#FFB547"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'a' }; }
  renderVals() {
    const accent = this.props.accent ?? '#C8F03C';
    const lvl = { low: ['منخفض', accent], mid: ['متوسط', '#FFB547'], high: ['مرتفع', '#FF7A66'] };
    const facC = (w) => w < 40 ? ['هادئ', accent] : w < 70 ? ['متوسط', '#FFB547'] : ['مزدحم', '#FF7A66'];
    const raw = [
      { id: 'a', name: 'محطة طريق الملك فهد', short: 'الملك فهد', dist: '1.2 كم', l: 'low', free: '6/8', wait: '2 د', fuel: [['91', 82], ['95', 64], ['ديزل', 45]], fac: [['البقالة', 30], ['المصلى', 55], ['دورات المياه', 20], ['المقهى', 82]] },
      { id: 'b', name: 'محطة حي الياسمين', short: 'الياسمين', dist: '2.8 كم', l: 'mid', free: '3/6', wait: '6 د', fuel: [['91', 58], ['95', 22], ['ديزل', 70]], fac: [['البقالة', 62], ['المصلى', 35], ['دورات المياه', 48], ['المقهى', 40]] },
      { id: 'c', name: 'محطة طريق أنس بن مالك', short: 'أنس بن مالك', dist: '4.1 كم', l: 'high', free: '1/8', wait: '14 د', fuel: [['91', 35], ['95', 80], ['ديزل', 15]], fac: [['البقالة', 88], ['المصلى', 74], ['دورات المياه', 66], ['المقهى', 91]] }
    ];
    const stations = raw.map((s) => {
      const on = s.id === this.state.picked;
      return { ...s, crowd: lvl[s.l][0], crowdColor: lvl[s.l][1],
        pick: () => this.setState({ picked: s.id }),
        on: on ? 'true' : 'false', bg: on ? '#16303F' : '#102230', border: on ? accent : '#1E3B4B' };
    });
    const s = raw.find((x) => x.id === this.state.picked);
    const sel = { name: s.name, short: s.short,
      fuel: s.fuel.map(([t, p]) => ({ t, p, w: p + '%', c: p < 30 ? '#FF7A66' : p < 60 ? '#FFB547' : accent })),
      fac: s.fac.map(([n, w]) => ({ n, lvl: facC(w)[0], c: facC(w)[1], w: w + '%' })) };
    return { accent, stations, sel };
  }
}
</script>
</body>
</html>
