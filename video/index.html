<style>
  /* ---- Brand tokens (edit here to match the official brand guide) ---- */
  :root{
    --ink:#04121F; --deep:#0A2A43; --teal:#12B5A5; --teal-d:#0B7F86; --mint:#7CF2D4;
    --gold:#F4B942; --white:#F5F8FA; --muted:#8FA3B5;
    --font:'Inter Tight','Noto Sans Arabic','Noto Sans Devanagari','Noto Sans KR','WenQuanYi Zen Hei','IPAGothic',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink);font-family:var(--font);color:var(--white)}
  #stage{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
  canvas{position:absolute;inset:0}
  .scene{position:absolute;inset:0;perspective:1400px}
  .rig,.p3{transform-style:preserve-3d}
  .rig{position:absolute;left:50%;top:50%;width:0;height:0}
  .center{position:absolute;left:0;top:0;transform-style:preserve-3d}
  .abs{position:absolute}
  .w{display:inline-block;white-space:pre;will-change:transform}
  .nowrap{white-space:nowrap}

  /* questions */
  .q{position:absolute;left:0;right:0;top:50%;text-align:center;transform-style:preserve-3d}
  .q .l1{font-weight:600;font-size:64px;letter-spacing:.32em;color:var(--teal);text-transform:uppercase}
  .q .l2{font-weight:900;font-size:180px;letter-spacing:-.03em;line-height:.95}
  .mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em}

  /* extruded type */
  .ex{position:relative;transform-style:preserve-3d;display:inline-block;white-space:nowrap}
  .ex .exl{white-space:nowrap}
  .ex .side{position:absolute;left:0;top:0}

  /* purpose */
  #purpose .small{font-weight:600;font-size:92px;letter-spacing:-.01em;white-space:nowrap}
  #purpose .big{font-weight:900;font-size:320px;letter-spacing:-.04em;line-height:.9}
  .grad{background:linear-gradient(180deg,#fff 10%,var(--mint) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* chat scene */
  #chat{background:radial-gradient(1200px 800px at 55% 45%,#0E3B55 0%,#071B2C 55%,var(--ink) 100%)}
  .browser{position:absolute;left:-660px;top:-390px;width:1320px;height:780px;border-radius:26px;background:#fff;overflow:hidden;
    box-shadow:0 80px 160px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.1),0 0 120px rgba(18,181,165,.25);color:#04121F}
  .chrome{height:54px;background:#EEF2F5;display:flex;align-items:center;padding:0 22px;gap:9px;border-bottom:1px solid #DDE4EA}
  .dot{width:14px;height:14px;border-radius:50%}
  .url{margin-left:auto;margin-right:auto;width:520px;height:34px;border-radius:17px;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;color:#3B4A5A;transform:translateX(-30px)}
  .nav{height:80px;display:flex;align-items:center;padding:0 56px;gap:34px;border-bottom:1px solid #EEF2F5}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:27px;letter-spacing:-.02em}
  .brand b{color:var(--teal)}
  .nav .links{display:flex;gap:30px;margin-left:auto;font-size:17px;font-weight:600;color:#3B4A5A}
  .pillbtn{background:var(--teal);color:#fff;font-weight:800;border-radius:999px;padding:12px 22px;font-size:17px}
  .hero{position:absolute;left:0;top:134px;right:0;bottom:0;background:linear-gradient(180deg,#fff 0%,#F2FAF9 100%)}
  .hero .blob{position:absolute;right:-120px;top:-60px;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(18,181,165,.22),rgba(18,181,165,0) 70%)}
  .hero .left{position:absolute;left:64px;top:62px;width:640px}
  .kick{display:inline-block;background:#E3F6F3;color:var(--teal-d);font-weight:800;font-size:15px;letter-spacing:.14em;text-transform:uppercase;padding:9px 16px;border-radius:999px}
  .hero h1{font-size:76px;line-height:.98;font-weight:900;letter-spacing:-.035em;margin:22px 0 22px}
  .hero h1 em{font-style:normal;color:var(--teal)}
  .hero p{font-size:21px;line-height:1.5;color:#4A5A6A;font-weight:500}
  .ctas{display:flex;gap:14px;margin-top:30px;align-items:center}
  .cta{background:var(--ink);color:#fff;font-weight:800;font-size:20px;padding:18px 30px;border-radius:14px;display:inline-flex;gap:10px;align-items:center}
  .cta2{border:2px solid #CFE3E0;color:var(--teal-d);font-weight:800;font-size:18px;padding:15px 22px;border-radius:14px}
  .stats{display:flex;gap:34px;margin-top:38px}
  .stats div{font-size:15px;color:#6A7A8A;font-weight:600}
  .stats b{display:block;font-size:34px;color:#04121F;font-weight:900;letter-spacing:-.02em}
  .widget{position:absolute;right:52px;bottom:34px;width:440px;height:570px;border-radius:22px;background:#F4F7F9;overflow:hidden;
    box-shadow:0 40px 80px rgba(4,18,31,.28),0 0 0 1px rgba(4,18,31,.06);display:flex;flex-direction:column}
  .whead{height:90px;background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#fff;display:flex;align-items:center;gap:14px;padding:0 20px;flex:none}
  .avatar{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center}
  .whead .t{font-weight:800;font-size:20px}
  .whead .s{font-size:14px;font-weight:600;opacity:.95;display:flex;align-items:center;gap:6px;margin-top:3px}
  .live{width:9px;height:9px;border-radius:50%;background:#7CFFB2;box-shadow:0 0 0 3px rgba(124,255,178,.3)}
  .lang{margin-left:auto;background:rgba(255,255,255,.18);border-radius:10px;padding:7px 12px;font-weight:800;font-size:14px}
  .wbody{flex:1;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:82%;font-size:17px;line-height:1.4;padding:13px 16px;font-weight:500;transform-origin:left bottom}
  .msg.op{background:#fff;border-radius:18px 18px 18px 6px;align-self:flex-start;box-shadow:0 2px 6px rgba(4,18,31,.06)}
  .msg.me{background:var(--teal);color:#fff;border-radius:18px 18px 6px 18px;align-self:flex-end;transform-origin:right bottom}
  .typing{display:flex;gap:6px;padding:16px 18px}
  .typing i{width:9px;height:9px;border-radius:50%;background:#9AB0C0;display:block}
  .winput{height:70px;background:#fff;border-top:1px solid #E3EAF0;display:flex;align-items:center;padding:0 14px 0 20px;gap:10px;flex:none}
  .winput span{flex:1;color:#9AAABA;font-size:17px}
  .send{width:44px;height:44px;border-radius:50%;background:var(--teal);display:grid;place-items:center}
  .cursor{position:absolute;left:0;top:0;width:34px;height:40px;z-index:5}
  .fcard{position:absolute;padding:22px 28px;border-radius:20px;background:rgba(10,42,67,.72);border:1px solid rgba(124,242,212,.35);
    box-shadow:0 30px 60px rgba(0,0,0,.4);font-weight:800;font-size:28px;white-space:nowrap;display:flex;gap:14px;align-items:center;color:#fff}
  .fcard small{display:block;font-size:16px;font-weight:600;color:var(--mint);letter-spacing:.12em;text-transform:uppercase}
  .caps{position:absolute;left:110px;top:300px}
  .cap{font-size:104px;font-weight:900;letter-spacing:-.035em;line-height:1.08;white-space:nowrap}

  /* languages */
  #langs{perspective:1600px}
  .card{position:absolute;left:-170px;top:-85px;width:340px;height:170px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(160deg,rgba(18,181,165,.9),rgba(11,127,134,.9));border:1px solid rgba(255,255,255,.25);backface-visibility:visible}
  .card.alt{background:linear-gradient(160deg,#fff,#DDEFF0);color:var(--ink)}
  .card.gold{background:linear-gradient(160deg,#FFD27A,var(--gold));color:var(--ink)}
  .card .g{font-size:58px;font-weight:800;line-height:1.1;white-space:nowrap}
  .card .n{font-size:17px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;opacity:.8;margin-top:6px}
  #langs .num{font-weight:900;font-size:560px;letter-spacing:-.05em;line-height:.85}
  #langs .lbl{font-weight:800;font-size:64px;letter-spacing:.5em;text-align:center;white-space:nowrap}
  #langs .sub{position:absolute;left:0;right:0;bottom:92px;text-align:center;font-size:44px;font-weight:600;color:var(--white)}
  #langs .sub b{color:var(--gold);font-weight:900}

  /* features */
  .panel{position:absolute;inset:0;perspective:1500px}
  .panel .kick2{font-size:34px;font-weight:800;letter-spacing:.42em;text-transform:uppercase}
  .panel .num{font-weight:900;font-size:430px;letter-spacing:-.05em;line-height:.86}
  .panel .lab{font-size:96px;font-weight:900;letter-spacing:-.03em;white-space:nowrap}
  .panel .cap2{font-size:34px;font-weight:600;margin-top:14px;white-space:nowrap}

  /* montage */
  .bub{position:absolute;left:0;top:0;white-space:nowrap;font-size:34px;font-weight:700;padding:18px 26px;border-radius:26px 26px 26px 8px;
    background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .bub.t{background:var(--teal);color:#fff;border-radius:26px 26px 8px 26px}
  .bub.g{background:var(--gold);color:var(--ink)}
  .mline{font-weight:900;letter-spacing:-.035em;text-align:center;white-space:nowrap;line-height:1}

  /* logo */
  #logo .ring{position:absolute;left:-200px;top:-200px;width:400px;height:400px;border-radius:50%;border:6px solid var(--teal)}
  #logo .word .mask{padding-bottom:.22em;margin-bottom:-.22em}
  #logo .word{font-size:176px;font-weight:900;letter-spacing:-.045em;line-height:1;white-space:nowrap;display:flex}
  #logo .tag{font-size:44px;font-weight:500;text-transform:uppercase;color:var(--white);white-space:nowrap;text-align:center}
  #logo .urlp{display:inline-flex;align-items:center;gap:18px;padding:16px 30px;border-radius:999px;border:2px solid rgba(124,242,212,.45);background:rgba(18,181,165,.14);font-size:30px;font-weight:700;white-space:nowrap}
  #logo .urlp b{font-weight:900;color:#fff}
  #logo .urlp span{color:var(--mint)}

  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
</style>

<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="shake" style="position:absolute;inset:0">
    <div class="scene" id="questions"></div>
    <div class="scene" id="purpose"></div>
    <div class="scene" id="chat"></div>
    <div class="scene" id="langs"></div>
    <div class="scene" id="feats"></div>
    <div class="scene" id="montage"></div>
    <div class="scene" id="logo"></div>
  </div>
  <div id="flash"></div>
  <div id="vig"></div>
  <canvas id="grain" width="960" height="540" style="width:1920px;height:1080px;opacity:.07;mix-blend-mode:screen"></canvas>
</div>

<script>
/* ============================ helpers ============================ */
const FPS_DEFAULT = 30, DURATION = 30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  lin:x=>x,
  outCubic:x=>1-Math.pow(1-x,3), inCubic:x=>x*x*x,
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x), inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outBack:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  outBackBig:x=>{const c1=2.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  outElastic:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(2*Math.PI)/3)+1,
};
const ease=(t,a,b,fn=E.outExpo)=>fn(P(t,a,b));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=s=>document.querySelector(s);
function el(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
function vis(e,on){const d=on?'':'none';if(e.style.display!==d)e.style.display=d}
function tf(e,s){e.style.transform=s}
function op(e,o){e.style.opacity=o}
function splitChars(text,parent,cls='w'){return [...text].map(c=>el('span',cls,c===' '?'&nbsp;':c,parent))}

/* extruded 3D type: stacked layers along Z */
function extrude(text,parent,{depth=14,step=5,front='grad',sideA='#12B5A5',sideB='#031C26',cls=''}={}){
  const w=el('div','ex '+cls,null,parent);const layers=[];
  const ca=hex(sideA),cb=hex(sideB);
  for(let i=depth;i>=0;i--){
    const s=el('div','exl '+(i?'side':front),null,w);s.textContent=text;
    s.style.transform=`translateZ(${-i*step}px)`;
    if(i){const k=i/depth;s.style.color=`rgb(${[0,1,2].map(j=>Math.round(lerp(ca[j],cb[j],k))).join(',')})`}
    layers.push(s);
  }
  w.setText=t=>{if(w._t===t)return;w._t=t;layers.forEach(l=>l.textContent=t)};
  return w;
}
function hex(h){h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}

const MARK_SVG=(size,dots=true)=>`
<svg width="${size}" height="${size}" viewBox="0 0 200 200" style="overflow:visible">
  <g class="mk-back"><path d="M78 26h86a26 26 0 0 1 26 26v50a26 26 0 0 1-26 26h-6v26l-30-26H78a26 26 0 0 1-26-26V52a26 26 0 0 1 26-26z" fill="#F4B942"/></g>
  <g class="mk-front"><path d="M36 62h88a26 26 0 0 1 26 26v52a26 26 0 0 1-26 26H72l-34 28v-28h-2a26 26 0 0 1-26-26V88a26 26 0 0 1 26-26z" fill="#12B5A5" stroke="#04121F" stroke-width="6"/>
  ${dots?'<circle class="mk-d" cx="54" cy="114" r="10" fill="#fff"/><circle class="mk-d" cx="80" cy="114" r="10" fill="#fff"/><circle class="mk-d" cx="106" cy="114" r="10" fill="#fff"/>':''}</g>
</svg>`;

/* ============================ background ============================ */
const bg=$('#bg'),bctx=bg.getContext('2d');
const PR=rng(7),parts=[...Array(220)].map(()=>({x:(PR()-.5)*4000,y:(PR()-.5)*2400,z:PR()*3000,s:PR()*2+0.6,c:PR()}));
function drawBG(t,s){
  const g=bctx;g.globalCompositeOperation='source-over';
  g.fillStyle='#04121F';g.fillRect(0,0,1920,1080);
  // moving glows
  const glows=[[960+Math.sin(t*.35)*500,540+Math.cos(t*.3)*200,900,'rgba(18,181,165,'+(0.22*s.glow)+')'],
               [960+Math.cos(t*.25)*700,700+Math.sin(t*.4)*200,700,'rgba(244,185,66,'+(0.08*s.glow)+')'],
               [400+Math.sin(t*.2)*200,200,800,'rgba(11,127,134,'+(0.18*s.glow)+')']];
  for(const [x,y,r,c] of glows){const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,c);rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,1920,1080)}
  // perspective grid floor
  if(s.grid>0){
    g.save();g.globalAlpha=s.grid;g.strokeStyle='rgba(124,242,212,.25)';g.lineWidth=1.2;
    const hz=640,off=(t*s.speed*120)%120;
    for(let i=0;i<22;i++){const z=(i*120-off+120);if(z<=0)continue;const y=hz+36000/z;if(y>1080)continue;g.globalAlpha=s.grid*clamp((y-hz)/300);g.beginPath();g.moveTo(0,y);g.lineTo(1920,y);g.stroke()}
    g.globalAlpha=s.grid*.7;
    for(let i=-20;i<=20;i++){const gr=g.createLinearGradient(0,hz,0,1080);gr.addColorStop(0,'rgba(124,242,212,0)');gr.addColorStop(1,'rgba(124,242,212,.3)');g.strokeStyle=gr;g.beginPath();g.moveTo(960+i*20,hz);g.lineTo(960+i*420,1080*1.6);g.stroke()}
    g.restore();
  }
  // particles
  for(const p of parts){
    let z=((p.z-t*s.speed*260)%3000+3000)%3000+1;const k=700/z;
    const x=960+p.x*k,y=540+p.y*k;if(x<-10||x>1930||y<-10||y>1090)continue;
    const a=clamp(1-z/3000)*s.part;g.fillStyle=p.c>.85?`rgba(244,185,66,${a})`:`rgba(124,242,212,${a*.8})`;
    g.beginPath();g.arc(x,y,p.s*k*1.4,0,6.283);g.fill();
  }
}
/* grain */
const grain=$('#grain'),gctx=grain.getContext('2d');const tiles=[];
(function(){const r=rng(99);for(let n=0;n<6;n++){const c=document.createElement('canvas');c.width=960;c.height=540;const x=c.getContext('2d');const im=x.createImageData(960,540);
 for(let i=0;i<im.data.length;i+=4){const v=r()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);tiles.push(c)}})();

/* ============================ scene: questions ============================ */
const SQ=$('#questions');
const Q=[
  {a:.15,b:1.45,l1:'What is the',l2:'meaning of life?'},
  {a:1.35,b:2.5,l1:'Why are we',l2:'here?'},
  {a:2.4,b:3.7,l1:'What happens',l2:'after death?'},
];
Q.forEach((q,qi)=>{
  const box=el('div','q',null,SQ);q.box=box;
  const l1=el('div','l1',null,box),l2=el('div','l2',null,box);
  if(qi===0){q.words=[...q.l1.split(' ').map(w=>el('span','w',w+' ',l1)),...q.l2.split(' ').map(w=>el('span','w',w+' ',l2))]}
  if(qi===1){const m1=el('span','mask',null,l1),m2=el('span','mask',null,l2);q.i1=el('span','w',q.l1,m1);q.i2=el('span','w',null,m2);
    q.i2.innerHTML='here<span style="color:var(--teal)">?</span>';l2.style.fontSize='300px'}
  if(qi===2){q.chars=[...splitChars(q.l1,l1),...splitChars(q.l2,l2)];q.chars.at(-1).style.color='var(--gold)';
    const r=rng(3);q.rand=q.chars.map(()=>[r()-.5,r()-.5,r(),r()-.5])}
  box.style.marginTop=(-box.offsetHeight/2||-160)+'px';
});
function sceneQuestions(t){
  vis(SQ,t<3.75);if(t>=3.75)return;
  for(const [qi,q] of Q.entries()){
    const on=t>=q.a&&t<q.b;vis(q.box,on);if(!on)continue;
    if(!q.m){q.m=1;q.box.style.marginTop=(-q.box.offsetHeight/2)+'px'}
    if(qi===0){
      q.words.forEach((w,i)=>{const k=ease(t,q.a+i*.07,q.a+i*.07+.55);tf(w,`translateZ(${lerp(-2200,0,k)}px) rotateY(${lerp(i%2?40:-40,0,k)}deg)`);op(w,clamp(k*2))});
      const x=ease(t,1.18,1.45,E.inExpo);tf(q.box,`translateZ(${x*1300}px)`);q.box.style.filter=`blur(${x*14}px)`;op(q.box,1-x);
    }
    if(qi===1){
      [q.i1,q.i2].forEach((w,i)=>{const k=ease(t,q.a+.03+i*.1,q.a+.6+i*.1);tf(w,`translateY(${lerp(110,0,k)}%) rotateX(${lerp(-80,0,k)}deg)`)});
      const x=ease(t,2.28,2.5,E.inExpo);tf(q.box,`translateX(${-x*2600}px) skewX(${-x*25}deg) scale(${1+ease(t,q.a,q.b,E.lin)*.08})`);q.box.style.filter=`blur(${x*10}px)`;
    }
    if(qi===2){

  row.style.left=(-RW/2+lerp((WW+40)/2,0,slide))+'px';row.style.top=(-RH/2-60)+'px';
  tf(markBox,`rotateY(${lerp(-200,0,E.outCubic(P(t,26.05,26.75)))}deg) scale(${lerp(.1,1,mk)})`);
  mkBack.style.transform=`translate(${lerp(-40,0,ease(t,26.25,26.7,E.outBack))}px,${lerp(40,0,ease(t,26.25,26.7,E.outBack))}px)`;
  mkDots.forEach((d,i)=>{const k=ease(t,26.55+i*.08,26.95+i*.08,E.outBackBig);d.style.transform=`scale(${k})`});
  // wordmark letters
  wchars.forEach((c,i)=>{const k=ease(t,26.75+i*.035,27.3+i*.035);tf(c,`translateY(${lerp(115,0,k)}%) rotate(${lerp(12,0,k)}deg)`)});
  // underline + tagline + url
  const ul=ease(t,27.4,27.95,E.inOutExpo);uline.style.width=(RW*ul)+'px';uline.style.left=(-RW/2)+'px';uline.style.top=(RH/2-40)+'px';op(uline,1);
  const tg=ease(t,27.6,28.4);tag.style.letterSpacing=lerp(.7,.16,tg)+'em';op(tag,tg);tag.style.left=(-tag.offsetWidth/2)+'px';tag.style.top=(RH/2+4)+'px';
  const u=ease(t,28.1,28.6,E.outBack);urlp.style.left=(-urlp.offsetWidth/2)+'px';urlp.style.top=(RH/2+100)+'px';tf(urlp,`translateY(${lerp(40,0,clamp(u))}px) scale(${lerp(.7,1,u)})`);op(urlp,clamp(u*2));
  // slow camera drift
  const d=P(t,26,30);tf(lgr,`translateZ(${lerp(-80,40,E.outCubic(d))}px) rotateY(${lerp(10,-4,E.outCubic(d))}deg) rotateX(${lerp(6,0,E.outCubic(d))}deg)`);
}

/* ============================ master render ============================ */
const FLASH=[[3.6,.35,9],[5.6,.25,10],[12.55,.3,10],[17.6,.55,8],[26.1,1,5]];
const SHAKE=[[3.6,10],[17.6,14],[18.6,8],[19.6,8],[20.6,8],[26.1,26]];
function render(t,frame=0){
  // background state per section
  const s={glow:1,grid:0,part:.7,speed:.4};
  if(t<3.6){s.glow=.35;s.part=.4;s.speed=.2}
  else if(t<5.6){s.glow=.9;s.grid=.6;s.speed=1.2}
  else if(t<17.6){s.glow=1;s.grid=t>12.5?.5:0;s.speed=.6}
  else if(t<21.6){s.grid=0}
  else if(t<26.1){s.speed=2.4;s.part=1;s.glow=.8}
  else{s.glow=1.2+Math.max(0,1-(t-26.1)*2);s.grid=.35;s.speed=.3}
  drawBG(t,s);
  sceneQuestions(t);scenePurpose(t);sceneChat(t);sceneLangs(t);sceneFeats(t);sceneMontage(t);sceneLogo(t);
  let f=0;for(const [a,amp,k] of FLASH){if(t>=a)f=Math.max(f,amp*Math.exp(-(t-a)*k))}op($('#flash'),f);
  let sx=0,sy=0;for(const [a,amp] of SHAKE){if(t>=a&&t<a+.5){const d=Math.exp(-(t-a)*9)*amp;sx+=Math.sin(t*97+a)*d;sy+=Math.cos(t*83+a)*d}}
  tf($('#shake'),`translate(${sx}px,${sy}px)`);
  gctx.clearRect(0,0,960,540);gctx.drawImage(tiles[frame%tiles.length],0,0);
}
window.render=render;window.DURATION=DURATION;
// preview mode: open index.html?play to watch in real time
if(location.search.includes('play')){const t0=performance.now();document.fonts.ready.then(()=>{(function loop(){const t=((performance.now()-t0)/1000)%DURATION;render(t,Math.floor(t*30));requestAnimationFrame(loop)})()})}
else if(location.search.match(/t=([\d.]+)/)){document.fonts.ready.then(()=>render(parseFloat(RegExp.$1)))}
</script>
